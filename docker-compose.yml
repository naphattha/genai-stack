version: "3.9"
services:

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Wealth3visual%
      MYSQL_DATABASE: set50
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql  
    networks:
      - genai-stack
  mysql-loader:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    depends_on:
      - mysql
    volumes:
      - ./src/mysql:/app
    networks:
      - genai-stack

  neo4j:
    image: neo4j:5.12
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j_data:/data
    networks:
      - genai-stack
  neo4j-loader:
    build:
      context: .
      dockerfile: Dockerfile.neo4jloader
    depends_on:
      - neo4j
    volumes:
      - ./src/neo4j:/app
    networks:
      - genai-stack
  # eng:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.eng
  #   ports:
  #     - "8501:8501"
  #   depends_on:
  #     - mysql
  #     - neo4j
  #     - ollama  
  #   environment:
  #     - MYSQL_HOST=mysql
  #     - MYSQL_USER=root
  #     - MYSQL_PASSWORD=Wealth3visual%
  #     - MYSQL_DATABASE=set50
  #     - NEO4J_URI=bolt://neo4j:7687
  #     - NEO4J_USERNAME=neo4j
  #     - NEO4J_PASSWORD=password
  #     - OLLAMA_MODEL=gemma:2b
  #     - OLLAMA_NUM_PARALLEL=1
  #   networks:
  #     - genai-stack

  thai:
    build:
      context: .
      dockerfile: Dockerfile.thai
    ports:
      - "8502:8502"
    depends_on:
      - neo4j
      - mysql
      - ollama  
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Wealth3visual%
      - MYSQL_DATABASE=set50
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - OLLAMA_MODEL=gemma:2b
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - genai-stack

  # chatbot-mysql-thai:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.chatbot-mysql-thai
  #   ports:
  #     - "8504:8504"
  #   depends_on:
  #     - mysql
  #     - ollama  
  #   environment:
  #     - MYSQL_HOST=mysql
  #     - MYSQL_USER=root
  #     - MYSQL_PASSWORD=Wealth3visual%
  #     - MYSQL_DATABASE=set50
  #     - OLLAMA_MODEL=gemma:2b
  #     - OLLAMA_NUM_PARALLEL=1
  #   networks:
  #     - genai-stack
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - genai-stack

networks:
  genai-stack:
    driver: bridge

volumes:
  mysql_data:
  neo4j_data:
  ollama: