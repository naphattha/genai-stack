version: "3.9"
services:

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Wealth3visual%
      MYSQL_DATABASE: set50
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mysql-loader:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    depends_on:
      - mysql
    volumes:
      - ./src/mysql:/app

  neo4j:
    image: neo4j:5.12
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - ./neo4j_data:/data
  neo4j-loader:
    build:
      context: .
      dockerfile: Dockerfile.neo4jloader
    depends_on:
      - neo4j
    volumes:
      - ./src/neo4j:/app

  chatbot-neo4j-eng:
    build:
      context: .
      dockerfile: Dockerfile.chatbot-neo4j-eng
    ports:
      - "8501:8501"
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password

  chatbot-neo4j-thai:
    build:
      context: .
      dockerfile: Dockerfile.chatbot-neo4j-thai
    ports:
      - "8502:8502"
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password

  chatbot-mysql-eng:
    build:
      context: .
      dockerfile: Dockerfile.chatbot-mysql-eng
    ports:
      - "8503:8503"
    depends_on:
      - mysql
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Wealth3visual%
      - MYSQL_DATABASE=set50

  chatbot-mysql-thai:
    build:
      context: .
      dockerfile: Dockerfile.chatbot-mysql-thai
    ports:
      - "8504:8504"
    depends_on:
      - mysql
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Wealth3visual%
      - MYSQL_DATABASE=set50

volumes:
  mysql_data:
  neo4j_data: